name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        sdk: [stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: dart format --output=none --set-exit-if-changed packages example
      - name: Analyze (strict, includes generated goldens)
        run: dart analyze --fatal-infos
      - name: Test generator
        run: dart test
        working-directory: packages/gqlify
      - name: Test runtime
        run: dart test
        working-directory: packages/gqlify_runtime
      - name: Test example
        run: dart test
        working-directory: example
      - name: Generated example is up to date (CLI)
        run: dart run gqlify check
        working-directory: example
      - name: build_runner produces the same files as the CLI
        shell: bash
        run: |
          dart run build_runner build
          git diff --exit-code -- lib
        working-directory: example
