name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Formatting is checked with a pinned SDK: `dart format` output can change
  # between SDK releases, and the check should not flip on its own. Bump the
  # version deliberately (and reformat) when upgrading.
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed packages example

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        sdk: [stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - name: Analyze (strict, includes generated goldens)
        run: dart analyze --fatal-infos
      - name: Test generator (incl. differential, concurrency and build_runner integration tests)
        run: dart test
        working-directory: packages/gqlify
      - name: Test runtime
        run: dart test
        working-directory: packages/gqlify_runtime
      - name: Test example
        run: dart test
        working-directory: example
      - name: Generated example is up to date (CLI)
        run: dart run gqlify check
        working-directory: example
      - name: build_runner produces the same files as the CLI
        shell: bash
        run: |
          dart run build_runner build
          git diff --exit-code -- lib
        working-directory: example
