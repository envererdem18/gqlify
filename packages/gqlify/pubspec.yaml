name: gqlify
description: >-
  GraphQL, simplified for Dart. A build-time GraphQL code generator producing
  small, strongly typed Dart APIs from a schema and operation documents.
version: 0.1.0-dev.2
publish_to: none
resolution: workspace

environment:
  sdk: ^3.8.0

executables:
  gqlify: gqlify

dependencies:
  args: ^2.5.0
  collection: ^1.18.0
  dart_style: ^3.0.0
  glob: ^2.1.0
  gql: ^1.0.1
  path: ^1.9.0
  pub_semver: ^2.1.4
  source_span: ^1.10.0
  yaml: ^3.1.2

dev_dependencies:
  gqlify_runtime: any
  lints: ^6.0.0
  test: ^1.25.0
