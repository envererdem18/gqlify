name: gqlify
description: >-
  GraphQL, simplified for Dart. A build-time GraphQL code generator producing
  small, strongly typed Dart APIs from a schema and operation documents.
version: 0.1.0
repository: https://github.com/envererdem18/gqlify/tree/main/packages/gqlify
issue_tracker: https://github.com/envererdem18/gqlify/issues
topics:
  - graphql
  - codegen
  - build-runner
  - api
  - code-generation
screenshots:
  - description: The gqlify logo.
    path: doc/gqlify-logo.png
resolution: workspace

environment:
  sdk: ^3.8.0

executables:
  gqlify: gqlify

dependencies:
  args: ^2.5.0
  build: ^4.0.0
  collection: ^1.18.0
  crypto: ^3.0.3
  dart_style: ^3.0.0
  glob: ^2.1.0
  gql: ^1.0.1
  path: ^1.9.0
  pub_semver: ^2.1.4
  source_span: ^1.10.0
  yaml: ^3.1.2

dev_dependencies:
  build_runner: ^2.10.0
  build_test: ^3.5.0
  gqlify_runtime: any
  lints: ^6.0.0
  logging: ^1.2.0
  test: ^1.25.0
