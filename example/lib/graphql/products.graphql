query GetProduct($sku: ID!) {
  product(sku: $sku) {
    ...ProductSummary
    created_at
    categories {
      id
      name
    }
  }
}

query GetCategories($parentId: ID) {
  categories(parentId: $parentId) {
    id
    name
    children {
      id
      name
    }
  }
}

query SearchProducts($filter: ProductFilter, $pageSize: Int) {
  results: products(filter: $filter, pageSize: $pageSize) {
    ...ProductSummary
  }
}

query Search($text: String!) {
  search(text: $text) {
    ... on Product {
      ...ProductSummary
    }
    ... on Category {
      id
      name
    }
  }
}
